[project]
name = "pantry-afcd-importer"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
  "click==8.2.1",
  "openpyxl==3.1.5",
]

[project.scripts]
afcd-import = "afcd_import.cli:main"

[dependency-groups]
dev = ["pytest==8.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afcd_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
